<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GameStore{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'store:index' %}">🎮 GameStore</a>
        <div>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'store:catalog' %}">Catálogo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'store:contact_provider' %}">Proveedores</a>
                </li>
                
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<footer class="bg-dark text-light text-center p-3 mt-5">
    <p>© 2025 GameStore </p>
</footer>

</body>
</html>
